name: "aws-datadog-logs-archive"
# Canonical GitHub repo
github_repo: "cloudposse-terraform-components/aws-datadog-logs-archive"
# Short description of this project
description: |-
  This component provisions Datadog Log Archives. It creates a single log archive pipeline for each AWS account. If the `catchall` flag is set, it creates a catchall archive within the same S3 bucket.

  Each log archive filters for the tag `env:$env` where `$env` is the environment/account name (e.g. `sbx`, `prd`, `tools`), as well as any tags identified in the `additional_query_tags` key. The `catchall` archive, as the name implies, filters for `*`.

  A second bucket is created for CloudTrail, and a CloudTrail is configured to monitor the log archive bucket and log activity to the CloudTrail bucket. To forward these CloudTrail logs to Datadog, the CloudTrail bucket's ID must be added to the `s3_buckets` key for our `datadog-lambda-forwarder` component.

  Both buckets support object lock, with overridable defaults of COMPLIANCE mode and a duration of 7 days.

  Prerequisites
  - Datadog integration set up in the target environment
    - Relies on the Datadog API and App keys added by our Datadog integration component

  Issues, Gotchas, Good-to-Knows
  - Destroy/reprovision process
    - Because of the protections for S3 buckets, destroying/replacing the bucket may require two passes or a manual bucket delete followed by Terraform cleanup. If the bucket has a full day or more of logs, deleting it manually first helps avoid Terraform timeouts.
    - Two-step process to destroy via Terraform:
      1) Set `s3_force_destroy` to `true` and apply
      2) Set `enabled` to `false` and apply, or run `terraform destroy`

  ## CloudTrail KMS Encryption

  By default, this component creates a KMS key to encrypt CloudTrail logs for compliance and security. The KMS encryption can be configured using these variables:

  - `cloudtrail_enable_kms_encryption` (default: `true`) - Enable/disable KMS encryption for CloudTrail logs
  - `cloudtrail_kms_key_arn` (default: `null`) - Provide an existing KMS key ARN to use instead of creating a new one
  - `cloudtrail_create_kms_key` (default: `true`) - Create a new KMS key when `cloudtrail_kms_key_arn` is not provided
  - `cloudtrail_kms_key_deletion_window_in_days` (default: `10`) - KMS key deletion window (7-30 days)
  - `cloudtrail_kms_key_enable_rotation` (default: `true`) - Enable automatic KMS key rotation

  The created KMS key includes the required policy statements for CloudTrail to encrypt logs and for authorized principals to decrypt them.

  ## Archive Tuning

  Four settings control how Datadog writes the archive and how much a search or rehydration is allowed to read back:

  - `compression_method` (default: `ZSTD`) - Compression Datadog uses when writing objects, either `ZSTD` or `GZIP`. `ZSTD` is the default and the recommendation in the Datadog console, especially where Archive Search is used: the objects are smaller, so they cost less to store, less to scan, and less in egress from the archive bucket. Note the Datadog provider itself defaults to `GZIP`.
  - `partitioning_attributes` (default: `null`) - Up to two low cardinality attributes used as partition keys, most frequently queried first. Logs sharing a partition value are co-located, so a search can skip partitions that cannot match before downloading them.
  - `lookup_attributes` (default: `null`) - Up to two high cardinality attributes, such as a trace, container or user ID, used to pinpoint individual logs within a data block.
  - `rehydration_max_scan_size_in_gb` (default: `null`) - Maximum volume, in GB, that a single job may scan against this archive. Despite the field name, which predates Archive Search, this one setting caps Archive Search queries and rehydration jobs alike. Left unset, a single wide search can scan the entire archive.

  Partitioning is worth more than it first appears. Datadog applies the query filter after the matching files are downloaded, so scan size is driven by the length of the searched time range rather than by how selective the query is: a narrow filter over a wide window still scans the whole window. Partition attributes are the only mechanism that prunes files before download.

  `compression_method`, `partitioning_attributes` and `lookup_attributes` are forward-only: they change how Datadog writes objects, so only logs archived after the setting is applied are affected and objects already written cannot be retrofitted. Changing `compression_method` on an existing archive only affects new files; objects already stored keep their original format and stay readable, since the two formats use different extensions.

  `rehydration_max_scan_size_in_gb` is not forward-only. It is applied at query time, so it bounds every subsequent Archive Search and rehydration job, including jobs that read objects written before the limit was set.

  These settings require the Datadog provider `>= 4.13.0`, the first release carrying all four attributes.

  ## Excluding Logs From the Archive

  `query_exclusions` subtracts from the archive query, producing `(<query>) -(<fragment> OR <fragment> ...)`.

  It exists because neither existing input can express "archive everything except this". `query_override` replaces the whole query, including the AWS account id that is only resolved at apply time, so using it to add a negation means restating the query and hardcoding the account id. `additional_query_tags` appends with `OR`, where a negation matches nearly everything.

  ```yaml
  query_exclusions:
    - '@http.useragent:"ELB-HealthChecker/2.0"'
    - '@http.url_details.path:("/health" OR "/ready" OR "/livez")'
  ```

  Worth knowing: **index exclusion filters do not stop archiving.** Per the Datadog documentation, excluded logs are discarded from indexes but still flow through Live Tail and are still archived. So health checks and similar high volume, low value traffic can be filtered out of the index and still fill the bucket. Combining an index exclusion filter with the matching `query_exclusions` fragment leaves that traffic visible in Live Tail for real time debugging while keeping it out of both the index and the archive.

  The exclusions apply to the catchall archive too when `catchall_enabled` is true. Without that they would be pointless there, since the catchall query is `*` and would pick the excluded logs straight back up into the same bucket under `/catchall`.

  Be deliberate about what goes in here. Dropping probe traffic is a cost decision; dropping audit logs such as CloudTrail or Kubernetes audit events is a compliance decision, and once a log is neither indexed nor archived nothing retains it.

